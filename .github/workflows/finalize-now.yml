name: finalize-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-now.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild NOW image
        shell: bash
        run: |
          cat .tmp-now/part-* > /tmp/now.b64
          base64 --decode /tmp/now.b64 > assets/now.webp
          test "$(wc -c < assets/now.webp)" -eq 69162
          echo "b9709ab56dbb3124839ceea58e49664683c1871028ba506328b04cd93e0df8f8  assets/now.webp" | sha256sum -c -
          rm -f assets/now.jpg
          rm -rf .tmp-now
          rm -f .github/workflows/finalize-now.yml

      - name: Update README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          s = s.replace("./assets/now.jpg", "./assets/now.webp")
          p.write_text(s)
          PY

      - name: Commit corrected asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix NOW section asset"
          git push

# rerun after all transfer parts are present
